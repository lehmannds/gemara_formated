labels:
  - name: speaker
    collapsible: false
    newline_before: false
    show_on_hover: false
    args:
      - name: type
        type: text
        required: false

  - name: verse
    collapsible: false
    positional: true
    newline_before: false
    show_on_hover: false
    args:
      - name: ref
        type: text
        required: true

  - name: question
    collapsible: false
    newline_before: true
    show_on_hover: false
    args:
      - name: id
        type: text
        required: false
        auto: true

  - name: answer
    collapsible: false
    newline_before: true
    show_on_hover: false
    args:
      - name: to
        type: text
        required: true

  - name: refers-to
    collapsible: false
    show_on_hover: false
    args: []

  - name: group
    collapsible: true
    show_on_hover: false
    args:
      - name: label
        type: text
        required: false
      - name: default_collapsed
        type: boolean
        required: false
        default: true

  - name: mishna
    collapsible: true
    newline_before: true
    show_on_hover: false
    args:
      - name: default_collapsed
        type: boolean
        required: false
        default: false

  - name: gemara
    collapsible: true
    newline_before: true
    show_on_hover: false
    args:
      - name: default_collapsed
        type: boolean
        required: false
        default: false

  - name: mishna+gemara
    collapsible: true
    removable: false
    user_addable: false
    newline_before: true
    show_on_hover: false
    args:
      - name: label
        type: text
        required: false
      - name: default_collapsed
        type: boolean
        required: false
        default: true

  - name: page
    collapsible: false
    positional: true
    newline_before: false
    show_on_hover: false
    args:
      - name: value
        type: text
        required: true
